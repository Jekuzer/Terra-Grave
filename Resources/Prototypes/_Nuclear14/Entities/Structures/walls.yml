- type: entity
  parent: BaseWall
  id: N14WallConcreteLight
  name: concrete wall
  suffix: light
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Walls/nc14/concrete.rsi
  - type: Icon
    sprite: _Nuclear14/Structures/Walls/nc14/concrete.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: wallsstore
    base: store

