- type: entity
  parent: ClothingHeadBase
  id: TerraGClothingHeadHatBasicHelmetMetal
  name: металлический шлем КМ-1
  abstract: false
  description: Самая распространённая модель имперского шлема, краска и опознавательные знаки сняты, лучший и не дорогой вариант для каждого вольного человека
  components:
  - type: Sprite
    sprite: _TerraGrave/Objects/Clothing/Head/BasicHelmetMilit.rsi
  - type: Clothing
    sprite: _TerraGrave/Objects/Clothing/Head/BasicHelmetMilit.rsi
    equipDelay: 1
    unequipDelay: 1
