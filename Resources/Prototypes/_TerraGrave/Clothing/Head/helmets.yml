      coefficients:
        Blunt: 0.9
        Slash: 0.95
        Piercing: 0.9
        Heat: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: HideLayerClothing 
    slots:
    - Hair
  - type: StaticPrice
    price: 70

