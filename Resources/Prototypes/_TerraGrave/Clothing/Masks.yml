    sprite: _TerraGrave/Objects/Clothing/Mask/MetalMask.rsi
  - type: Clothing
    sprite: _TerraGrave/Objects/Clothing/Mask/MetalMask.rsi
    equipDelay: 1
    unequipDelay: 1
  - type: Mask
  - type: IngestionBlocker
