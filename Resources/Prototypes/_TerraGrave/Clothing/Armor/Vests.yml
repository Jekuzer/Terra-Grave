- type: entity
  parent: [ ClothingOuterBase, AllowSuitStorageClothing ]
  id: TerraGClothingOuterVestArmorBasic
  name: боевой жилет
  description: Достаточно популярный бронежилет, не имеет никаких опознавательных знаков, вряд ли вызовет проблемы и путаницу, чиста броня - чиста жизнь
  components:
  - type: Sprite
    sprite: _TerraGrave/Objects/Clothing/Outerclothing/Vest/BasicVestD.rsi
  - type: Clothing
    sprite: _TerraGrave/Objects/Clothing/Outerclothing/Vest/BasicVestD.rsi
    equipDelay: 1
    unequipDelay: 1
  - type: Armor
    coverage:
    - Chest
    - Groin
    traumaDeductions: 
      Dismemberment: 0.9
      OrganDamage: 0.9
      BoneDamage: 0.9
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.85
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: StaticPrice
    price: 100

