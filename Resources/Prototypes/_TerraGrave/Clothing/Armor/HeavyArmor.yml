- type: entity
  parent: ClothingOuterHardsuitBase
  id: TerraGClothingOuterHeavyImperialArmor
  name: тяжёлая броня империи
  description: Тяжёлая броня, производимая до армагеддона в штучных количествах, используется Оберстами и изредка тяжёлыми пехотинцами имперских войск, отлично защищает от всего, но требует экипирования всех элементов для эффективного использования
  components:
  - type: Sprite
    sprite: _TerraGrave/Objects/Clothing/Outerclothing/Armor/imperialheavyarmor/ImperialLeaderArmor.rsi
  - type: Clothing
    sprite: _TerraGrave/Objects/Clothing/Outerclothing/Armor/imperialheavyarmor/ImperialLeaderArmor.rsi
    equipDelay: 3
    unequipDelay: 3.5
  - type: FireProtection
    reduction: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.5
        Piercing: 0.45
        Heat: 0.75
        Radiation: 0.65
    flatReductions: 
        Blunt: 4
        Slash: 3
        Piercing: 3
        Heat: 4
        Caustic: 2
        Radiation: 1
  - type: ClothingSpeedModifier
    walkModifier: 0.3
    sprintModifier: 0.3
  - type: UserInterface
    interfaces:
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: ToggleableClothing
    requiredSlot: outerClothing
    blockUnequipWhenAttached: true
    replaceCurrentClothing: false
    clothingPrototypes:
      head: TerraGClothingHeadHelmetHeavyArmorImp
      mask: TerraGClothingMaskGasmaskHeavyArmorImp
      gloves: TerraGClothingHeavyArmorGauntletsImp
      shoes: TerraGClothingArmorBootsImperial
      back: TerraGClothingPowerSystemsBackImperial
  - type: HeldSpeedModifier
  - type: StaticPrice
    price: 2000

- type: entity
  parent: [Clothing, ContentsExplosionResistanceBase]
  id: TerraGClothingPowerSystemsBackImperial
  name: батарея экзокостюма
  description: Долговечная батарея для экзоскелета, позволяет запитать костюм для его эффективной работы
  categories: [ HideSpawnMenu ]
