  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    sprite: _TerraGrave/Objects/Clothing/Outerclothing/Armor/imperialheavyarmor/ImperialLeaderArmorBatar.rsi
    slots:
    - back
  - type: ClothingSpeedModifier
    walkModifier: 2.5
    sprintModifier: 2.5
  - type: TemperatureProtection
    coefficient: 0.7
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
    flatReductions: 
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 2
        Caustic: 1
        Radiation: 1

