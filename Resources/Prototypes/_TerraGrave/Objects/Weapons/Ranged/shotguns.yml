- type: entity
  name: помповый трубчатый дробовик
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: TerraGWeaponShotgunPipePump
  description: Дешёвый трубчатый помповый дробовик, очень простой по конструкции, исользует дробь 12 калибра
  components: 
  - type: Item
    sprite: _TerraGrave/Objects/Weapons/Ranged/Shotguns/PumpPipeShothun.rsi
  - type: Sprite
    sprite: _TerraGrave/Objects/Weapons/Ranged/Shotguns/PumpPipeShothun.rsi 
  - type: Clothing
    sprite: _TerraGrave/Objects/Weapons/Ranged/Shotguns/PumpPipeShothun.rsi
  - type: GunRequiresWield 
  - type: Gun
    fireRate: 1.5
  - type: GunSpreadModifier
    spread: 1.4
  - type: BallisticAmmoProvider
    capacity: 4
    autoCycle: false
  - type: Tag
    tags:
    - WeaponShotgunKammerer

- type: entity
  name: Дробовик "Звонец"
  parent: [BaseItem, BaseGunWieldable]
  id: TerraGWeaponShotgunZvonec
  description: Продвинутый по конструкции и функционалу дробовик, в нём в основном используется титан и полимерные материалы, имеет несколько режимов стрельбы
  components:
  - type: Sprite
    sprite: _TerraGrave/Objects/Weapons/Ranged/Shotguns/AdvShotgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: _TerraGrave/Objects/Weapons/Ranged/Shotguns/AdvShotgun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield 
  - type: Gun
    fireRate: 3 
    selectedMode: Burst
    availableModes:
    - Burst
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: GunSpreadModifier
    spread: 0.8
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 880
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3