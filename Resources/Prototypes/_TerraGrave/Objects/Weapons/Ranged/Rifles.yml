- type: entity
  name: охотничья винтовка
  parent: [BaseWeaponSniper, BaseGunWieldable]
  id: TGWeaponHuntingRifle
  description: 
  components:
  - type: Clothing
    sprite: _TerraGrave/Objects/Weapons/Ranged/rifles/HuntingRifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: _TerraGrave/Objects/Weapons/Ranged/rifles/HuntingRifle.rsi
    layers:
    - state: base
    - state: base1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: base
    inHandsFillBaseName: -fill-
    inHandsMaxFillLevels: 1
    equippedFillBaseName: -fill-
    equippedMaxFillLevels: 1
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: Gun
    minAngle: 4
    maxAngle: 18
    angleIncrease: 3.5
    angleDecay: 2
  - type: StaticPrice
    price: 300

- type: entity
  name: винтовка ПХC-2
  parent: BaseWeaponRifle
  id: TerraGWeaponRifleDMR
  description: Марксманская винтовка "Пехотная Хоншера Стрелка" модель 2, в отличии от первой прототипной версии она была доведена до ума и запущена в массовое частное производство, благодаря уникальной конструкции практически не требует очистки
  components:
  - type: Sprite
    sprite: _TerraGrave/Objects/Weapons/Ranged/rifles/DMRifle.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _TerraGrave/Objects/Weapons/Ranged/rifles/DMRifle.rsi
  - type: Gun
    minAngle: 3
    maxAngle: 25
    angleIncrease: 8
    angleDecay: 6
    fireRate: 2.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 400

